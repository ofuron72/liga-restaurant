version: '3.8'
services:

  kitchen-db:
    image: postgres:15.1-alpine
    container_name: kitchen-db
    environment:
      - POSTGRES_DB=kitchen-service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  waiter-db:
    image: postgres:15.1-alpine
    container_name: waiter-db
    environment:
      - POSTGRES_DB=waiter-service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"


